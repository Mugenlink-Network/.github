name: Feature Request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      placeholder: What user problem or gap does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - pipeline (ETL / dbt / Snowflake)
        - api (backend / Kafka ingestor / auth)
        - console (dashboard / explorer profiles)
        - sdk (shared libs / UI kit)
        - infra (Terraform / Helm / k8s / CI)
        - gitops (ArgoCD / deployments)
    validations:
      required: true
