name: Secret Scan

# Reusable secret-scanning workflow (detect-secrets, consistent with the
# .secrets.baseline files committed across the org). Call from any repo:
#
#   jobs:
#     secret-scan:
#       uses: Mugenlink-Network/.github/.github/workflows/secret-scan.yml@main
#
# Fails the build if a tracked file contains a secret not present in the
# repo's .secrets.baseline. Repos without a baseline are scanned outright.

on:
  workflow_call:
    inputs:
      detect-secrets-version:
        description: 'Pinned detect-secrets version'
        required: false
        type: string
        default: '1.5.0'

permissions:
  contents: read

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        env:
          DS_VERSION: ${{ inputs.detect-secrets-version }}
        run: pip install "detect-secrets==${DS_VERSION}"

      - name: Audit tracked files against baseline
        run: |
          if [ -f .secrets.baseline ]; then
            echo "Auditing tracked files against .secrets.baseline"
            git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
          else
            echo "No .secrets.baseline found — scanning all tracked files"
            git ls-files -z | xargs -0 detect-secrets-hook
          fi
