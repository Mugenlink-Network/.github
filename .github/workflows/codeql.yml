name: CodeQL

# Reusable SAST workflow (CodeQL). Call from any repo, e.g.:
#
#   jobs:
#     codeql:
#       uses: Mugenlink-Network/.github/.github/workflows/codeql.yml@main
#       permissions:
#         actions: read
#         contents: read
#         security-events: write
#       with:
#         languages: '["python"]'   # or '["javascript-typescript"]' / '["go"]'
#
# The caller MUST grant security-events: write (and actions/contents: read)
# for SARIF upload to GitHub code scanning to succeed.

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array of CodeQL languages, e.g. ["python"]'
        required: true
        type: string
      queries:
        description: 'CodeQL query suite to run'
        required: false
        type: string
        default: security-and-quality

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d77b13a0df3134d64a457ea9003f600b09fa1c8a  # v3
        with:
          languages: ${{ matrix.language }}
          queries: ${{ inputs.queries }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@d77b13a0df3134d64a457ea9003f600b09fa1c8a  # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d77b13a0df3134d64a457ea9003f600b09fa1c8a  # v3
        with:
          category: "/language:${{ matrix.language }}"
