name: Scorecard

# Reusable OpenSSF Scorecard workflow. Call from any repo on a schedule:
#
#   on:
#     schedule:
#       - cron: "0 6 * * 1"
#     push:
#       branches: [main]
#   jobs:
#     scorecard:
#       uses: Mugenlink-Network/.github/.github/workflows/scorecard.yml@main
#       permissions:
#         security-events: write
#         id-token: write
#         contents: read
#
# publish_results defaults to false (private repos). Set true only for public
# repos that want an OpenSSF badge.

on:
  workflow_call:
    inputs:
      publish_results:
        description: 'Publish results to the OpenSSF API (public repos only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46  # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results }}

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@d77b13a0df3134d64a457ea9003f600b09fa1c8a  # v3
        with:
          sarif_file: results.sarif
